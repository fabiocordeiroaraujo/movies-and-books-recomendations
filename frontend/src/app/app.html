<header class="app-header">
  <a class="brand" routerLink="/catalog" aria-label="Reel and Read — minhas preferências">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <path d="M5 7.5A3.5 3.5 0 0 1 8.5 4H16v23H8.5A3.5 3.5 0 0 0 5 30.5v-23Z" />
        <path d="M27 7.5A3.5 3.5 0 0 0 23.5 4H16v23h7.5a3.5 3.5 0 0 1 3.5 3.5v-23Z" />
        <circle cx="22.5" cy="10.5" r="2.5" />
      </svg>
    </span>
    <span class="brand-copy">
      <strong>Reel <i>&</i> Read</strong>
      <small>minhas preferências</small>
    </span>
  </a>

  <app-user-selector
    [users]="state.users()"
    [selectedUserId]="state.activeUserId()"
    [loading]="state.loadingUsers()"
    (selectionChange)="selectUser($event)"
    (createRequested)="openUserForm()"
  />
</header>

@if (state.error()) {
  <div class="global-alert" role="alert">
    <span>{{ state.error() }}</span>
    <button type="button" aria-label="Fechar mensagem" (click)="state.clearError()">×</button>
  </div>
}

<router-outlet />
<app-user-form />

<footer class="app-footer">
  <a class="footer-brand" routerLink="/catalog">Reel <i>&</i> Read</a>
  <p>Seu catálogo pessoal de filmes e livros.</p>
  <span>Preferências, do seu jeito.</span>
</footer>
