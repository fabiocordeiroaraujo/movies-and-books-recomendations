apiVersion: batch/v1
kind: CronJob
metadata:
  name: reel-and-read-recommendation-worker
spec:
  schedule: "0 3 * * *"
  timeZone: America/Recife
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: recommendation-worker
              image: reel-and-read-recommendation-worker:1.0.0
              imagePullPolicy: IfNotPresent
              args: ["python", "-m", "recommendation_worker", "daily"]
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: reel-and-read-recommendation-db
                      key: host
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: reel-and-read-recommendation-db
                      key: database
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: reel-and-read-recommendation-db
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: reel-and-read-recommendation-db
                      key: password
                - name: MODEL_ARTIFACT_DIR
                  value: /artifacts
                - name: HF_HOME
                  value: /models
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 6Gi
              volumeMounts:
                - name: models
                  mountPath: /models
                - name: artifacts
                  mountPath: /artifacts
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: reel-and-read-model-cache
            - name: artifacts
              persistentVolumeClaim:
                claimName: reel-and-read-model-artifacts
